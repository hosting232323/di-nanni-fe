<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="/doriana.webp" type="image/webp" fetchpriority="high" media="(max-width: 599px)">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" onload="this.rel='stylesheet'">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" onload="this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet"></noscript>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doriana Di Nanni</title>
  </head>
  <body>
    <!-- Hero statica (solo mobile, solo home): resta visibile finche' la hero di Vue non e' montata
         (FullScreenLanding la rimuove), cosi' il primo paint non aspetta i chunk delle route. -->
    <style>
      #hero-placeholder { display: none; }
      @media (max-width: 599px) {
        #hero-placeholder { display: block; position: absolute; top: 70px; left: 0; width: 100%; height: calc(100vh - 64px); overflow: hidden; z-index: 1; background: linear-gradient(to bottom, #f9dce5, #f5c4d2); }
        #hero-placeholder div { position: absolute; bottom: 0; right: 0; width: 100%; height: 78vh; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }
        #hero-placeholder img { height: 100%; width: auto; object-fit: contain; object-position: bottom center; margin-bottom: -2px; }
      }
    </style>
    <div id="hero-placeholder"><div><img src="/doriana.webp" alt="Dott.ssa Di Nanni" width="1400" height="1051" fetchpriority="high" decoding="async" /></div></div>
    <script>if (location.pathname !== '/') document.getElementById('hero-placeholder').remove();</script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
